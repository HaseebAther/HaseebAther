<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="TLC Tech AI service desk: incoming ticket, intake, triage, enrichment, routing and after-hours agents, routing time cut from 20 to 30 minutes to about 5">
  <style>
    .m{font-family:Consolas,'Liberation Mono','Courier New',monospace}
    .s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .t{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif}
    .box{fill:#11130e;stroke:#4b5320;stroke-width:1.5}
    .hot{fill:#11130e;stroke:#8f9d5a;stroke-width:2}
    .lbl{font-size:10px;fill:#8f9d5a;letter-spacing:2px}
    .nm{font-size:14px;fill:#e8e4d8;font-weight:bold}
    .sub{font-size:10.5px;fill:#8a8778}
    .flow{fill:none;stroke:#8f9d5a;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    @keyframes blink{50%{opacity:.15}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes ping{0%{r:4;opacity:1}100%{r:16;opacity:0}}
    .ping{animation:ping 1.6s ease-out infinite}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease-out both}
    @keyframes hl{0%,100%{stroke:#4b5320}50%{stroke:#8f9d5a}}
    .a1{animation:hl 3s 0s infinite}.a2{animation:hl 3s .6s infinite}.a3{animation:hl 3s 1.2s infinite}.a4{animation:hl 3s 1.8s infinite}.a5{animation:hl 3s 2.4s infinite}
  </style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#161a11" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8f9d5a"/>
    </marker>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#4b5320"/><stop offset="1" stop-color="#8f9d5a"/></linearGradient>
  </defs>

  <rect width="900" height="330" fill="#0a0b08"/>
  <rect width="900" height="330" fill="url(#grid)"/>
  <g fill="none" stroke="#8f9d5a" stroke-width="2"><path d="M8 30V8H30M870 8H892V30M8 300V322H30M870 322H892V300"/></g>

  <text class="m" x="28" y="34" font-size="12" fill="#8f9d5a" letter-spacing="2">MISSION BRIEFING // OPERATION: <tspan fill="#e8e4d8">SERVICE DESK</tspan>  ·  CLIENT: TLC TECH</text>
  <g transform="translate(782 30) rotate(-6)">
    <rect x="-62" y="-15" width="124" height="26" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text class="t" x="0" y="5" font-size="16" fill="#c0392b" text-anchor="middle" letter-spacing="3">CLASSIFIED</text>
  </g>

  <!-- squad bracket -->
  <path d="M150 100V90H742V100" fill="none" stroke="#4b5320" stroke-width="2"/>
  <rect x="356" y="76" width="180" height="20" fill="#0a0b08"/>
  <text class="m" x="446" y="90" font-size="11" fill="#e8e4d8" text-anchor="middle" letter-spacing="2">SQUAD: 7 AI AGENTS</text>

  <!-- links -->
  <path class="flow" d="M128 165H146" marker-end="url(#arr)"/>
  <path class="flow" d="M254 165H268" marker-end="url(#arr)"/>
  <path class="flow" d="M376 165H390" marker-end="url(#arr)"/>
  <path class="flow" d="M498 165H512" marker-end="url(#arr)"/>
  <path class="flow" d="M620 165H634" marker-end="url(#arr)"/>
  <path class="flow" d="M742 165H766" marker-end="url(#arr)"/>

  <!-- source -->
  <rect class="box" x="20" y="133" width="108" height="64"/>
  <text class="m lbl" x="30" y="153">INBOUND</text>
  <text class="s nm" x="30" y="173">IT Ticket</text>
  <text class="m sub" x="30" y="188">any hour</text>

  <!-- agents -->
  <g>
    <rect class="hot a1" x="150" y="120" width="104" height="90"/>
    <text class="m lbl" x="160" y="140">AGENT 01</text>
    <text class="s nm" x="160" y="161">Intake</text>
    <text class="m sub" x="160" y="178">capture +</text>
    <text class="m sub" x="160" y="192">normalize</text>

    <rect class="hot a2" x="272" y="120" width="104" height="90"/>
    <text class="m lbl" x="282" y="140">AGENT 02</text>
    <text class="s nm" x="282" y="161">Triage</text>
    <text class="m sub" x="282" y="178">categorize +</text>
    <text class="m sub" x="282" y="192">prioritize</text>

    <rect class="hot a3" x="394" y="120" width="104" height="90"/>
    <text class="m lbl" x="404" y="140">AGENT 03</text>
    <text class="s nm" x="404" y="161">Enrichment</text>
    <text class="m sub" x="404" y="178">pull context</text>
    <text class="m sub" x="404" y="192">+ history</text>

    <rect class="hot a4" x="516" y="120" width="104" height="90"/>
    <text class="m lbl" x="526" y="140">AGENT 04</text>
    <text class="s nm" x="526" y="161">Routing</text>
    <text class="m sub" x="526" y="178">right desk,</text>
    <text class="m sub" x="526" y="192">first time</text>

    <rect class="hot a5" x="638" y="120" width="104" height="90"/>
    <text class="m lbl" x="648" y="140">AGENT 05-07</text>
    <text class="s nm" x="648" y="161">After-Hours</text>
    <text class="m sub" x="648" y="178">scheduling +</text>
    <text class="m sub" x="648" y="192">support ops</text>
  </g>

  <!-- objective -->
  <rect x="770" y="133" width="115" height="64" fill="#1a0d0b" stroke="#c0392b" stroke-width="2"/>
  <text class="m" x="781" y="153" font-size="10" fill="#c0392b" letter-spacing="2">OBJECTIVE</text>
  <text class="s nm" x="781" y="173">Resolved</text>
  <text class="m sub" x="781" y="188">fast + routed</text>
  <circle class="ping" cx="874" cy="143" r="4" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="874" cy="143" r="3" fill="#c0392b"/>

  <!-- after-action report -->
  <text class="m" x="28" y="246" font-size="10" fill="#8f9d5a" letter-spacing="2">AFTER-ACTION // ROUTING TIME</text>
  <text class="m" x="28" y="266" font-size="11" fill="#8a8778">BEFORE</text>
  <rect class="grow" x="100" y="258" width="500" height="9" fill="#c0392b" opacity=".85"/>
  <text class="m" x="612" y="267" font-size="12" fill="#e8e4d8">20–30 MIN</text>
  <text class="m" x="28" y="286" font-size="11" fill="#8a8778">AFTER</text>
  <rect class="grow" style="animation-delay:.6s" x="100" y="278" width="100" height="9" fill="url(#bar)"/>
  <text class="m" x="212" y="287" font-size="12" fill="#e8e4d8">~5 MIN</text>
  <text class="t" x="872" y="284" font-size="30" fill="#8f9d5a" text-anchor="end" letter-spacing="2">-80%</text>

  <path d="M28 298H872" stroke="#2a3020"/>
  <circle class="blink" cx="34" cy="313" r="4" fill="#8f9d5a"/>
  <text class="m" x="46" y="317" font-size="11" fill="#8a8778" letter-spacing="2">STATUS: <tspan fill="#8f9d5a">DEPLOYED</tspan>   ·   MULTI-AGENT AI   ·   24/7 COVERAGE   ·   FEWER HANDS ON EVERY TICKET</text>
</svg>
