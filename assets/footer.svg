<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Ghost out. End of transmission.">
  <style>
    .m{font-family:Consolas,'Liberation Mono','Courier New',monospace}
    .t{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif}
    @keyframes blink{50%{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .eq rect{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.1s ease-in-out infinite}
  </style>
  <defs>
    <pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#4b5320"/>
    </pattern>
  </defs>
  <rect width="900" height="140" fill="#0a0b08"/>
  <rect width="900" height="8" fill="url(#haz)" opacity=".7"/>
  <g class="eq" fill="#4b5320">
    <rect x="300" y="44" width="5" height="40" style="animation-delay:0s"/>
    <rect x="310" y="44" width="5" height="40" style="animation-delay:.2s"/>
    <rect x="320" y="44" width="5" height="40" style="animation-delay:.4s"/>
    <rect x="330" y="44" width="5" height="40" style="animation-delay:.1s"/>
    <rect x="566" y="44" width="5" height="40" style="animation-delay:.3s"/>
    <rect x="576" y="44" width="5" height="40" style="animation-delay:.5s"/>
    <rect x="586" y="44" width="5" height="40" style="animation-delay:.15s"/>
    <rect x="596" y="44" width="5" height="40" style="animation-delay:.35s"/>
  </g>
  <text class="t" x="450" y="80" font-size="42" fill="#e8e4d8" text-anchor="middle" letter-spacing="6">GHOST OUT<tspan class="cur" fill="#c0392b">_</tspan></text>
  <text class="m" x="450" y="112" font-size="12" fill="#8f9d5a" text-anchor="middle" letter-spacing="3">// END OF TRANSMISSION  ·  ALWAYS LEARNING · ALWAYS BUILDING · ALWAYS OPTIMIZING</text>
  <rect y="132" width="900" height="8" fill="url(#haz)" opacity=".7"/>
</svg>
