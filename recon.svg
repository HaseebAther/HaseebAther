  @keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade 1.2s .6s ease-out both}
  @keyframes ping{0%{r:4;opacity:1}100%{r:18;opacity:0}}.ping{animation:ping 1.6s ease-out infinite}
