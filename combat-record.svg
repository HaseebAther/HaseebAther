<svg xmlns="http://www.w3.org/2000/svg" width="440" height="248" viewBox="0 0 440 248" role="img" aria-label="COMBAT RECORD">
<style>
  .m{font-family:Consolas,'Liberation Mono','Courier New',monospace}.s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.t{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif}
  @keyframes blink{50%{opacity:.15}}.blink{animation:blink 1.1s steps(1) infinite}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rise{animation:rise .6s ease-out both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s ease-out both}
  
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#161a11" stroke-width="1"/></pattern>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#4b5320"/><stop offset="1" stop-color="#8f9d5a"/></linearGradient>
</defs>
<rect width="440" height="248" fill="#0a0b08"/>
<rect width="440" height="248" fill="url(#grid)"/>
<path d="M8 26V8H26M414 8H432V26M8 222V240H26M414 240H432V222" fill="none" stroke="#8f9d5a" stroke-width="2"/>
<text class="m" x="24" y="36" font-size="12" fill="#8f9d5a" letter-spacing="2">COMBAT RECORD</text>
<circle class="blink" cx="242.0" cy="32" r="4" fill="#c0392b"/>
<text class="m" x="416" y="36" font-size="12" fill="#8a8778" letter-spacing="1" text-anchor="end">OPERATOR HASEEBATHER</text>
