  <text class="m" x="416" y="84" font-size="10" fill="#8a8778" letter-spacing="1" text-anchor="end">NEXT: CAPTAIN · 30 XP</text>
  <rect x="24" y="94" width="392" height="5" fill="#2a3020"/>
  <rect class="grow" x="24" y="94" width="368.5" height="5" fill="url(#bar)"/>
</g>
<g class="rise" style="animation-delay:0.15s">
