</g>
<g class="rise" style="animation-delay:0.65s">
  <path d="M232 198V234" stroke="#4b5320" stroke-width="2"/>
  <text class="m" x="242" y="208" font-size="10" fill="#8a8778" letter-spacing="2">REPOS DEPLOYED</text>
