  <path d="M24 154V190" stroke="#4b5320" stroke-width="2"/>
  <text class="m" x="34" y="164" font-size="10" fill="#8a8778" letter-spacing="2">PULL REQUESTS</text>
  <text class="t" x="34" y="190" font-size="24" fill="#e8e4d8" letter-spacing="1">3</text>
