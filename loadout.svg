  <rect x="226" y="75" width="140" height="6" fill="#2a3020"/>
  <rect class="grow" style="animation-delay:0.2s" x="226" y="75" width="114.6" height="6" fill="url(#bar)"/>
  <text class="m" x="416" y="82" font-size="11" fill="#8f9d5a" text-anchor="end">81.9%</text>
</g>
<g class="rise" style="animation-delay:0.2s">
