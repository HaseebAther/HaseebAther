name: Build profile cards + snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Ghost stat cards
        run: node .github/scripts/build-cards.mjs
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to count private contributions too.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          OUT_DIR: dist

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c0392b&color_dots=#ebedf0,#c5ccaa,#9aab5c,#6b7d3a,#4b5320
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c0392b&color_dots=#161a11,#2f3a1c,#4b5320,#6b7d3a,#9aab5c

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
